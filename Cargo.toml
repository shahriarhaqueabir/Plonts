[package]
name = "lovelygarden"
version = "0.1.0"
edition = "2021"
description = "LovelyGarden frontend (Leptos CSR, compiled to WASM by Trunk)"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["garden-core", "src-tauri"]
resolver = "2"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
garden-core = { path = "garden-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
